# Foundation Solo — reproducible verification for the existing four-crate Rust slice.
#
# Scope: CI/tooling only. This workflow builds, lints, tests and smoke-tests the
# accepted crate graph, runs the accepted fail-closed architecture checker, and runs
# a fail-closed component security gate (`cargo-deny` over advisories, bans, licenses
# and sources). It adds no product feature, no runtime, no HTTP surface, no browser
# target and no deployment.
#
# Trust model, deliberately narrow:
#   * read-only token (`permissions: contents: read`), no secrets, no write-capable step;
#   * the only external action is `actions/checkout` pinned to one full commit SHA with
#     credentials not persisted;
#   * `CARGO_NET_OFFLINE=true` is the Cargo-level job default. It is a Cargo setting: it
#     does not restrict `actions/checkout` or `rustup toolchain install`, and each step
#     that needs the network overrides it explicitly. The network-capable operations of
#     this workflow are: checkout; toolchain installation; the single explicit
#     network-enabled locked product-dependency fetch (`cargo fetch --locked`), which is
#     the only place this workspace's Cargo dependencies are acquired; the component
#     security gate, which downloads the pinned `cargo-deny 0.20.2` release archive
#     (SHA-256 verified before extraction) from the scanner's official GitHub release and
#     fetches the current RustSec advisory database; and, on Ubuntu only, the disposable
#     `RUSTSEC-2026-0009` fixture, which resolves a throwaway `time 0.3.46` manifest with
#     `cargo generate-lockfile` and is never compiled, never part of this workspace and
#     never allowed to touch the real lockfile;
#   * ordinary product build, lint, test and check commands after the locked fetch run
#     with `CARGO_NET_OFFLINE=true` and `--locked` where applicable. Neither the advisory
#     refresh nor the disposable fixture is offline, and this file makes no claim that a
#     Cargo environment variable denies the network system-wide;
#   * every mandatory gate is a visible, failure-propagating step: no `continue-on-error`,
#     no masked exit code, no `|| true`, no broad `if` skip.
name: rust-verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Recheck advisory data even when no source changed: a new RustSec entry must be able
  # to fail this repository without a commit. Off the top of the hour by design.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Cargo-level default: offline. Overridden to "false" by the network-enabled locked
  # product fetch, by the security gate's scanner download and advisory-data refresh, and
  # by the Ubuntu-only disposable advisory fixture. This is a Cargo setting; it does not
  # restrict checkout, toolchain installation or the scanner archive download.
  CARGO_NET_OFFLINE: "true"
  RUST_BACKTRACE: "1"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shell: bash
            cli_path: target/release/solo-cli
          - os: windows-2025
            shell: pwsh
            cli_path: target/release/solo-cli.exe
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      # actions/checkout v7.0.1 (tag verified 2026-11-08), full commit SHA pin.
      # v7 declares `runs.using: node24` and needs runner v2.327.1 or newer; the
      # hosted ubuntu-24.04 and windows-2025 images satisfy that. Credentials are
      # still not persisted and the job token remains `contents: read`.
      - name: Checkout (pinned full commit SHA, credentials not persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # ---------------------------------------------------------------------------
      # Identity of the code under verification. Runner OS/image and commit are
      # recorded so the conclusion can be tied to an exact revision.
      # ---------------------------------------------------------------------------
      - name: Record revision and runner identity (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "commit=$GITHUB_SHA"
          echo "tree=$(git rev-parse HEAD^{tree})"
          echo "lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"
          echo "runner_os=${{ runner.os }} runner_arch=${{ runner.arch }}"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
          uname -a

      - name: Record revision and runner identity (Windows)
        if: runner.os == 'Windows'
        run: |
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "git rev-parse HEAD failed" }
          Write-Output "commit=$env:GITHUB_SHA"
          Write-Output "tree=$(git rev-parse 'HEAD^{tree}')"
          Write-Output "lock_sha256=$((Get-FileHash 'Cargo.lock' -Algorithm SHA256).Hash.ToLower())"
          Write-Output "runner_os=${{ runner.os }} runner_arch=${{ runner.arch }}"
          Write-Output "image=$env:ImageOS-$env:ImageVersion"

      # ---------------------------------------------------------------------------
      # Toolchain: exactly the channel pinned by the tracked rust-toolchain.toml
      # (1.99.1 + rustfmt + clippy). Never "stable"/"latest"; a mismatch fails here.
      # ---------------------------------------------------------------------------
      - name: Install and assert the pinned toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup --version

      - name: Assert exact rustc/cargo versions (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          rustc --version --verbose
          rustc --version | grep -q '^rustc 1\.99\.1 ' || { echo "::error::rustc is not 1.99.1"; exit 1; }

      - name: Assert exact rustc/cargo versions (Windows)
        if: runner.os == 'Windows'
        run: |
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw "rustc --version failed" }
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw "cargo --version failed" }
          rustc --version --verbose

      # ---------------------------------------------------------------------------
      # The network-enabled acquisition of this workspace's locked product dependencies.
      # Product build, lint, test and check commands after it run with the job-level
      # CARGO_NET_OFFLINE=true, so a crate that is needed but unfetched is a hard failure
      # instead of a silent download. Later steps that are network-capable are named where
      # they appear: the security gate's scanner download and advisory-data refresh, and
      # the Ubuntu-only disposable advisory fixture. This is a Cargo setting: checkout and
      # toolchain installation are unaffected by it.
      # ---------------------------------------------------------------------------
      - name: Fetch locked packages (only network-enabled Cargo acquisition)
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked

      # ---------------------------------------------------------------------------
      # Component security gate. This step is network-capable: it downloads the pinned
      # scanner archive from its official GitHub release — falling back, only after a
      # transient primary failure, to the official GitHub release-asset API endpoint for the
      # same pinned asset ID — and fetches the current RustSec advisory database. That is the
      # security/advisory data path, not product dependency acquisition; `cargo-deny` then
      # reads the already-fetched locked product graph.
      # Ordinary product Cargo commands remain offline under CARGO_NET_OFFLINE=true.
      # Any failure below (download, digest, archive safety, version, data freshness,
      # policy finding, lock or tree mutation) fails the job.
      # ---------------------------------------------------------------------------
      - name: Component security gate — cargo-deny 0.20.2 (Linux, verified archive)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          DENY_VERSION="0.20.2"
          DENY_ASSET="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          DENY_SHA256="9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
          DENY_ASSET_ID="471598214"
          DENY_URL="https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${DENY_ASSET}"
          DENY_API_URL="https://api.github.com/repos/EmbarkStudios/cargo-deny/releases/assets/${DENY_ASSET_ID}"
          WORK="$RUNNER_TEMP/deny-gate"
          ARCHIVE="$WORK/archive/$DENY_ASSET"

          fail() { echo "::error::$*"; exit 1; }

          rm -rf "$WORK"
          mkdir -p "$WORK/archive" "$WORK/tool"

          # Bounded retry for transient acquisition availability only. curl retries the
          # transient HTTP statuses (including 504) at most four times, so five attempts
          # inside a finite 120 s retry window. It bypasses no integrity or advisory gate,
          # does not make the network offline, and cannot guarantee that the external CDN
          # is available; an exhausted budget still fails this mandatory job.
          if PRIMARY_HTTP_CODE="$(curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 --retry 4 --retry-max-time 120 --retry-connrefused \
            --write-out '%{http_code}' \
            --output "$ARCHIVE" "$DENY_URL")"; then
            PRIMARY_CURL_EXIT=0
          else
            PRIMARY_CURL_EXIT=$?
          fi
          # Acquisition has one primary route (the official release download above) and,
          # only after a transient primary failure, one fallback route: the official GitHub
          # release-asset API endpoint for this same pinned asset ID. Both are GitHub-hosted
          # HTTPS delivery of the same archive and may share a CDN, so neither route is
          # promised to be available. The SHA-256 below, not the route, decides what was
          # acquired. A completed transfer with wrong bytes fails there and is never retried
          # through the other route, and a nontransient primary failure (TLS/certificate
          # rejection, forbidden protocol, unsupported option, malformed reply, or HTTP
          # 401/403/404/410) fails immediately without falling back.
          if [ "$PRIMARY_CURL_EXIT" -ne 0 ]; then
            TRANSIENT=0
            case "$PRIMARY_CURL_EXIT" in
              6|7|18|28|52|56) TRANSIENT=1 ;;
              22) case "$PRIMARY_HTTP_CODE" in 429|5[0-9][0-9]) TRANSIENT=1 ;; esac ;;
            esac
            echo "primary_scanner_route=failed curl_exit=$PRIMARY_CURL_EXIT http=$PRIMARY_HTTP_CODE transient=$TRANSIENT"
            [ "$TRANSIENT" = "1" ] \
              || fail "cargo-deny archive download failed nontransiently (curl exit $PRIMARY_CURL_EXIT, http $PRIMARY_HTTP_CODE)"
            rm -f "$ARCHIVE"
            # The fallback keeps the same finite budgets, pins HTTPS for the initial request
            # and for every redirect, and sends no token or other credential.
            FALLBACK_HTTP_CODE="$(curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --connect-timeout 10 --max-time 30 --retry 4 --retry-max-time 120 --retry-connrefused \
              --header 'Accept: application/octet-stream' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --write-out '%{http_code}' \
              --output "$ARCHIVE" "$DENY_API_URL")" \
              || fail "cargo-deny release-asset API fallback download failed (http $FALLBACK_HTTP_CODE)"
            echo "official_api_fallback_used=1 http=$FALLBACK_HTTP_CODE"
          fi

          ACTUAL_SHA256="$(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
          [ "$ACTUAL_SHA256" = "$DENY_SHA256" ] \
            || fail "cargo-deny archive digest mismatch: $ACTUAL_SHA256"

          MEMBERS="$(tar -tzf "$ARCHIVE")" || fail "cargo-deny archive listing failed"
          printf '%s\n' "$MEMBERS" | grep -Eq '^[A-Za-z0-9._/-]+$' \
            || fail "unsafe characters in cargo-deny archive member names"
          if printf '%s\n' "$MEMBERS" | grep -Eq '(^/|^[A-Za-z]:|(^|/)\.\.(/|$))'; then
            fail "cargo-deny archive contains a member that escapes the extraction root"
          fi

          tar -xzf "$ARCHIVE" -C "$WORK/tool" --no-same-owner --no-same-permissions \
            || fail "cargo-deny extraction failed"
          BIN="$(find "$WORK/tool" -maxdepth 2 -type f -name cargo-deny -print -quit)"
          [ -n "$BIN" ] || fail "cargo-deny binary not found after extraction"
          REPORTED_VERSION="$("$BIN" --version)"
          [ "$REPORTED_VERSION" = "cargo-deny $DENY_VERSION" ] \
            || fail "unexpected scanner version: $REPORTED_VERSION"
          echo "scanner=$REPORTED_VERSION archive_sha256=$ACTUAL_SHA256"

          LOCK_BEFORE="$(sha256sum Cargo.lock | cut -d' ' -f1)"

          # Fresh advisory data on every run. A failed or missing fetch is a failed
          # gate: there is no offline, frozen or cached-snapshot fallback below.
          "$BIN" -L info fetch db 2>&1 | tee "$WORK/fetch.log" \
            || fail "RustSec advisory database fetch failed"
          DB_DIR="$(find "${CARGO_HOME:-$HOME/.cargo}/advisory-dbs" -maxdepth 2 \
            -type d -name .git -print -quit | xargs -r dirname)"
          [ -n "$DB_DIR" ] || fail "no advisory database checkout found after fetch"
          DB_COMMIT="$(git -C "$DB_DIR" rev-parse HEAD)"
          DB_COMMIT_DATE="$(git -C "$DB_DIR" log -1 --format=%cI)"
          DB_FETCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Every policy class runs separately against the real locked workspace, so a
          # failure names its own class and cannot be masked by another check's exit.
          for CLASS in advisories bans licenses sources; do
            "$BIN" --config "$GITHUB_WORKSPACE/deny.toml" \
              --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
              --locked --all-features check "$CLASS" --show-stats 2>&1 \
              | tee "$WORK/check-$CLASS.log" \
              || fail "cargo-deny check $CLASS failed for the locked workspace graph"
          done

          LOCK_AFTER="$(sha256sum Cargo.lock | cut -d' ' -f1)"
          [ "$LOCK_AFTER" = "$LOCK_BEFORE" ] \
            || fail "Cargo.lock changed during the security gate"
          [ -z "$(git status --porcelain)" ] \
            || fail "working tree is dirty after the security gate"
          echo "::notice::component security gate passed: $REPORTED_VERSION archive sha256 $ACTUAL_SHA256; RustSec $DB_COMMIT fetched $DB_FETCHED_AT; advisories, bans, licenses and sources all ok on the unchanged locked graph"

          {
            echo "DENY_SCANNER_VERSION=$REPORTED_VERSION"
            echo "DENY_SCANNER_ASSET=$DENY_ASSET"
            echo "DENY_SCANNER_SHA256=$ACTUAL_SHA256"
            echo "DENY_DB_COMMIT=$DB_COMMIT"
            echo "DENY_DB_COMMIT_DATE=$DB_COMMIT_DATE"
            echo "DENY_DB_FETCHED_AT=$DB_FETCHED_AT"
            echo "DENY_LOCK_SHA256=$LOCK_AFTER"
          } >> "$GITHUB_ENV"
          echo "security_gate=pass db_commit=$DB_COMMIT fetched_at=$DB_FETCHED_AT"

      # Same gate, same pinned artifact and same policy, implemented for the Windows
      # host. Identical assertions in the host's native shell; no weakened variant. This
      # host's instance is network-capable for the same two reasons: the pinned scanner
      # archive download and the RustSec advisory-data refresh.
      - name: Component security gate — cargo-deny 0.20.2 (Windows, verified archive)
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $DenyVersion = '0.20.2'
          $DenyAsset = "cargo-deny-$DenyVersion-x86_64-pc-windows-msvc.tar.gz"
          $DenySha256 = '975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc'
          $DenyAssetId = '471599057'
          $DenyUrl = "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DenyVersion/$DenyAsset"
          $DenyApiUrl = "https://api.github.com/repos/EmbarkStudios/cargo-deny/releases/assets/$DenyAssetId"
          $Work = Join-Path $env:RUNNER_TEMP 'deny-gate'
          $Archive = Join-Path $Work "archive\$DenyAsset"

          if (Test-Path -LiteralPath $Work) { Remove-Item -LiteralPath $Work -Recurse -Force }
          New-Item -ItemType Directory -Path (Join-Path $Work 'archive') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $Work 'tool') -Force | Out-Null

          # Same bounded retry policy as the Linux host: transient statuses including 504,
          # at most four retries inside a finite 120 s window. No integrity or advisory gate
          # is bypassed, the network is not made offline, and an exhausted budget still fails
          # this mandatory job through the existing exit-status check below.
          # Same two official routes as the Linux host: one primary release download and,
          # only after a transient primary failure, one GitHub release-asset API fallback
          # for this same pinned asset ID. Both are GitHub-hosted HTTPS delivery and may
          # share a CDN, so neither is promised available; the digest below decides what was
          # acquired, a wrong-digest transfer is never retried through the other route, and
          # a nontransient primary failure fails at once without falling back.
          $PrimaryHttpCode = (curl.exe --fail --silent --show-error --location --proto '=https' --tlsv1.2 `
            --connect-timeout 10 --max-time 30 --retry 4 --retry-max-time 120 --retry-connrefused `
            --write-out '%{http_code}' `
            --output $Archive $DenyUrl)
          $PrimaryCurlExit = $LASTEXITCODE
          if ($PrimaryCurlExit -ne 0) {
            $Transient = $false
            if ($PrimaryCurlExit -in 6, 7, 18, 28, 52, 56) {
              $Transient = $true
            } elseif ($PrimaryCurlExit -eq 22 -and ($PrimaryHttpCode -eq '429' -or $PrimaryHttpCode -match '^5\d\d$')) {
              $Transient = $true
            }
            Write-Host "primary_scanner_route=failed curl_exit=$PrimaryCurlExit http=$PrimaryHttpCode transient=$Transient"
            if (-not $Transient) {
              throw "cargo-deny archive download failed nontransiently (curl exit $PrimaryCurlExit, http $PrimaryHttpCode)"
            }
            if (Test-Path -LiteralPath $Archive) { Remove-Item -LiteralPath $Archive -Force }
            # The fallback keeps the same finite budgets, pins HTTPS for the initial request
            # and for every redirect, and sends no token or other credential.
            $FallbackHttpCode = (curl.exe --fail --silent --show-error --location `
              --proto '=https' --proto-redir '=https' --tlsv1.2 `
              --connect-timeout 10 --max-time 30 --retry 4 --retry-max-time 120 --retry-connrefused `
              --header 'Accept: application/octet-stream' `
              --header 'X-GitHub-Api-Version: 2022-11-28' `
              --write-out '%{http_code}' `
              --output $Archive $DenyApiUrl)
            if ($LASTEXITCODE -ne 0) {
              throw "cargo-deny release-asset API fallback download failed (curl exit $LASTEXITCODE, http $FallbackHttpCode)"
            }
            Write-Host "official_api_fallback_used=1 http=$FallbackHttpCode"
          }

          $ActualSha256 = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ActualSha256 -ne $DenySha256) {
            throw "cargo-deny archive digest mismatch: $ActualSha256"
          }

          $Members = & tar -tzf $Archive
          if ($LASTEXITCODE -ne 0) { throw "cargo-deny archive listing failed (exit $LASTEXITCODE)" }
          foreach ($Member in $Members) {
            if ($Member -notmatch '^[A-Za-z0-9._/-]+$') {
              throw "unsafe characters in cargo-deny archive member name: $Member"
            }
            if ($Member -match '^/|^[A-Za-z]:|(^|/)\.\.(/|$)') {
              throw "cargo-deny archive member escapes the extraction root: $Member"
            }
          }

          & tar -xzf $Archive -C (Join-Path $Work 'tool')
          if ($LASTEXITCODE -ne 0) { throw "cargo-deny extraction failed (exit $LASTEXITCODE)" }

          $Bin = Get-ChildItem -LiteralPath (Join-Path $Work 'tool') -Recurse -File -Filter 'cargo-deny.exe' |
            Select-Object -First 1
          if (-not $Bin) { throw "cargo-deny.exe not found after extraction" }
          $ReportedVersion = & $Bin.FullName --version
          if ($LASTEXITCODE -ne 0 -or $ReportedVersion -ne "cargo-deny $DenyVersion") {
            throw "unexpected scanner version: $ReportedVersion"
          }
          Write-Output "scanner=$ReportedVersion archive_sha256=$ActualSha256"

          $LockBefore = (Get-FileHash -LiteralPath 'Cargo.lock' -Algorithm SHA256).Hash.ToLowerInvariant()

          & $Bin.FullName -L info fetch db 2>&1 | Tee-Object -FilePath (Join-Path $Work 'fetch.log')
          if ($LASTEXITCODE -ne 0) { throw "RustSec advisory database fetch failed (exit $LASTEXITCODE)" }

          $DbRoot = if ($env:CARGO_HOME) { Join-Path $env:CARGO_HOME 'advisory-dbs' }
            else { Join-Path $env:USERPROFILE '.cargo/advisory-dbs' }
          $GitDir = Get-ChildItem -LiteralPath $DbRoot -Recurse -Depth 2 -Force -Directory -Filter '.git' |
            Select-Object -First 1
          if (-not $GitDir) { throw "no advisory database checkout found after fetch under $DbRoot" }
          $DbDir = $GitDir.Parent.FullName
          $DbCommit = (& git -C $DbDir rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $DbCommit) { throw "cannot resolve the fetched advisory database commit" }
          $DbCommitDate = (& git -C $DbDir log -1 --format=%cI).Trim()
          $DbFetchedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')

          foreach ($Class in @('advisories', 'bans', 'licenses', 'sources')) {
            & $Bin.FullName --config 'deny.toml' --manifest-path 'Cargo.toml' --locked --all-features `
              check $Class --show-stats 2>&1 | Tee-Object -FilePath (Join-Path $Work "check-$Class.log")
            if ($LASTEXITCODE -ne 0) {
              throw "cargo-deny check $Class failed (exit $LASTEXITCODE) for the locked workspace graph"
            }
          }

          $LockAfter = (Get-FileHash -LiteralPath 'Cargo.lock' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($LockAfter -ne $LockBefore) { throw "Cargo.lock changed during the security gate" }
          $Dirty = & git status --porcelain
          if ($LASTEXITCODE -ne 0) { throw "git status failed after the security gate" }
          if ($Dirty) { throw "working tree is dirty after the security gate: $Dirty" }

          Write-Output "::notice::component security gate passed: $ReportedVersion archive sha256 $ActualSha256; RustSec $DbCommit fetched $DbFetchedAt; advisories, bans, licenses and sources all ok on the unchanged locked graph"

          @(
            "DENY_SCANNER_VERSION=$ReportedVersion",
            "DENY_SCANNER_ASSET=$DenyAsset",
            "DENY_SCANNER_SHA256=$ActualSha256",
            "DENY_DB_COMMIT=$DbCommit",
            "DENY_DB_COMMIT_DATE=$DbCommitDate",
            "DENY_DB_FETCHED_AT=$DbFetchedAt",
            "DENY_LOCK_SHA256=$LockAfter"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV
          Write-Output "security_gate=pass db_commit=$DbCommit fetched_at=$DbFetchedAt"

      # ---------------------------------------------------------------------------
      # Deliberate advisory negative probe (Ubuntu only). Proves that the same pinned
      # scanner and the same freshly fetched RustSec database detect a real published
      # advisory. The fixture is a disposable manifest in $RUNNER_TEMP: no Git
      # repository, no production crate, no mutation of the real lockfile, and the
      # crate's code is never compiled or executed. This Ubuntu-only step is itself
      # network-capable: it overrides the Cargo offline default and resolves the throwaway
      # manifest's dependencies with `cargo generate-lockfile`, so it is neither product
      # dependency acquisition nor offline. The step fails closed if the
      # probe succeeds unexpectedly, if the expected advisory is missing, or if the failure
      # is unrelated to that advisory.
      # ---------------------------------------------------------------------------
      - name: Advisory negative probe — RUSTSEC-2026-0009 (Ubuntu only)
        if: runner.os == 'Linux'
        env:
          CARGO_NET_OFFLINE: "false"
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/deny-gate"
          ARCHIVE="$WORK/archive/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz"
          BIN="$(find "$WORK/tool" -maxdepth 2 -type f -name cargo-deny -print -quit)"
          FIXTURE="$RUNNER_TEMP/deny-negative-probe"
          fail() { echo "::error::$*"; exit 1; }

          # The scanner and archive verified by the previous step must still be intact.
          [ -n "$BIN" ] || fail "cargo-deny binary missing for the negative probe"
          [ "$("$BIN" --version)" = "cargo-deny 0.20.2" ] \
            || fail "negative probe scanner version mismatch"
          [ "$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" = "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f" ] \
            || fail "negative probe archive digest mismatch"

          # RUSTSEC-2026-0009 affects time >=0.3.6, <0.3.47 (patched >=0.3.47); 0.3.46 is
          # therefore genuinely affected. Only the manifest is resolved: the pinned
          # `time` source is fetched, not compiled.
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE/src"
          cat > "$FIXTURE/Cargo.toml" <<'TOML'
          [package]
          name = "advisory-negative-probe"
          version = "0.0.0"
          edition = "2021"
          publish = false

          [dependencies]
          time = "=0.3.46"
          TOML
          printf 'fn main() {}\n' > "$FIXTURE/src/main.rs"

          ( cd "$FIXTURE" && cargo generate-lockfile ) || fail "fixture lockfile generation failed"
          grep -q '^name = "time"$' "$FIXTURE/Cargo.lock" || fail "fixture does not resolve the time crate"
          grep -q '^version = "0.3.46"$' "$FIXTURE/Cargo.lock" || fail "fixture did not lock time 0.3.46"

          set +e
          "$BIN" --config "$GITHUB_WORKSPACE/deny.toml" --manifest-path "$FIXTURE/Cargo.toml" \
            check advisories --show-stats 2>&1 | tee "$WORK/negative-probe.log"
          PROBE_STATUS="${PIPESTATUS[0]}"
          set -e

          if [ "$PROBE_STATUS" -eq 0 ]; then
            fail "negative probe passed unexpectedly: the advisory gate did not refuse a known-vulnerable fixture"
          fi
          grep -q 'RUSTSEC-2026-0009' "$WORK/negative-probe.log" \
            || fail "negative probe did not report the expected RUSTSEC-2026-0009 advisory"
          grep -Eq 'error\[(vulnerability|yanked|unmaintained|unsound|notice)\]' "$WORK/negative-probe.log" \
            || fail "negative probe failure is not an advisory-class diagnostic"

          echo "::notice::advisory negative probe refused time 0.3.46 with RUSTSEC-2026-0009 and exit $PROBE_STATUS, while the unchanged locked workspace graph passed all four checks"

          rm -rf "$FIXTURE"
          [ -z "$(git status --porcelain)" ] || fail "working tree is dirty after the negative probe"
          {
            echo "DENY_PROBE_ADVISORY=RUSTSEC-2026-0009"
            echo "DENY_PROBE_CRATE=time@0.3.46"
            echo "DENY_PROBE_EXIT=$PROBE_STATUS"
            echo "DENY_PROBE_RESULT=refused"
          } >> "$GITHUB_ENV"
          echo "negative_probe=refused exit=$PROBE_STATUS advisory=RUSTSEC-2026-0009"



      # ---------------------------------------------------------------------------
      # Workspace identity gate: the real workspace must still be exactly the four
      # approved crates. Approved edges are enforced by the accepted checker below.
      # ---------------------------------------------------------------------------
      - name: Workspace package-set gate (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps > "$RUNNER_TEMP/metadata-nodeps.json"
          test -s "$RUNNER_TEMP/metadata-nodeps.json"
          for name in solo-domain solo-application solo-adapters solo-cli; do
            grep -q "\"name\":\"$name\"" "$RUNNER_TEMP/metadata-nodeps.json" \
              || { echo "::error::missing approved workspace crate $name"; exit 1; }
          done
          unique=$(grep -o '"name":"solo-[a-z-]*"' "$RUNNER_TEMP/metadata-nodeps.json" | sort -u | wc -l)
          test "$unique" -eq 4 \
            || { echo "::error::workspace crate set is not the approved four (found $unique)"; exit 1; }
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/metadata-full.json"
          test -s "$RUNNER_TEMP/metadata-full.json"
          echo "metadata=ok workspace_members=4"

      - name: Workspace package-set gate (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo metadata --locked --format-version 1 --no-deps > "$env:RUNNER_TEMP/metadata-nodeps.json"
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata --no-deps failed" }
          if (-not (Test-Path "$env:RUNNER_TEMP/metadata-nodeps.json")) { throw "metadata output missing" }
          $meta = Get-Content "$env:RUNNER_TEMP/metadata-nodeps.json" -Raw | ConvertFrom-Json
          $names = @($meta.packages | ForEach-Object { $_.name } | Sort-Object)
          $expected = @('solo-adapters', 'solo-application', 'solo-cli', 'solo-domain')
          if ($names.Count -ne 4) { throw "workspace crate count $($names.Count) is not the approved four" }
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $names) {
            throw "workspace crate set changed: $($names -join ',')"
          }
          cargo metadata --locked --format-version 1 > $null
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed" }
          Write-Output "metadata=ok workspace_members=4"

      # ---------------------------------------------------------------------------
      # R03 D2 snapshot proof — disposable test filesystems (Ubuntu only).
      #
      # The hosted Ubuntu root filesystem is ext4, which does not implement reflink, so a
      # positive FICLONE proof cannot be staged on the checkout. This step builds exactly one
      # loop-backed Btrfs image of 192 MiB (below the 256 MiB ceiling) under $RUNNER_TEMP and
      # mounts only that image, plus one 16 MiB tmpfs mount that genuinely lacks reflink so the
      # fail-closed refusal can be proven natively rather than simulated. Every path is
      # task-owned and uniquely named from the run id; nothing outside $RUNNER_TEMP is written,
      # no host mount is touched and no package is installed. The guaranteed cleanup step at the
      # end of the job unmounts and removes exactly these paths.
      # ---------------------------------------------------------------------------
      - name: R03 snapshot-test filesystems (Ubuntu only, disposable)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          tag="solo-r03-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          img="$RUNNER_TEMP/$tag.img"
          mnt="$RUNNER_TEMP/$tag-btrfs"
          tmp="$RUNNER_TEMP/$tag-tmpfs"

          # Every command is wrapped so a failure names itself in an annotation instead of
          # leaving a bare exit status that cannot be reviewed.
          step() {
            local label="$1"
            shift
            local output
            if ! output="$("$@" 2>&1)"; then
              echo "::error::$label failed: ${output//$'\n'/ | }"
              exit 1
            fi
            echo "$label: ${output//$'\n'/ | }"
          }

          for p in "$img" "$mnt" "$tmp"; do
            if [ -e "$p" ]; then
              echo "::error::refusing to reuse pre-existing path $p"
              exit 1
            fi
          done
          if ! command -v mkfs.btrfs > /dev/null 2>&1; then
            echo "::error::mkfs.btrfs is not preinstalled on this image; installing it would be an unapproved package, so the positive D2 proof cannot be constructed"
            exit 1
          fi

          step "host_kernel" uname -r
          step "mkfs_version" mkfs.btrfs --version
          step "image_create" truncate -s 192M "$img"
          step "image_format" mkfs.btrfs -q -f "$img"
          # The mount points are created first; the test directory is created *inside* the
          # mounted filesystems afterwards, because a directory made before a mount would be
          # shadowed by it.
          step "mountpoint_create" mkdir -p "$mnt" "$tmp"
          step "btrfs_mount" sudo mount -o loop "$img" "$mnt"
          step "tmpfs_mount" sudo mount -t tmpfs -o size=16m,mode=0755 tmpfs "$tmp"
          step "content_create" sudo mkdir -p "$mnt/content"
          step "fixture_ownership" sudo chown -R "$(id -u):$(id -g)" "$mnt/content" "$tmp"
          step "supported_mount" findmnt -no FSTYPE,SOURCE,TARGET "$mnt"
          step "unsupported_mount" findmnt -no FSTYPE,SOURCE,TARGET "$tmp"
          step "supported_fstype" stat -f -c 'fstype=%T block=%s' "$mnt/content"
          step "unsupported_fstype" stat -f -c 'fstype=%T block=%s' "$tmp"

          {
            echo "SOLO_TEST_SOURCE_FS_ROOT=$mnt/content"
            echo "SOLO_TEST_UNSUPPORTED_FS_ROOT=$tmp"
          } >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------------
      # Mandatory standard gates. Each step is a single cargo command, so both
      # shells propagate its real exit status to the workflow.
      # ---------------------------------------------------------------------------
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Strict lint (warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test (workspace, all targets, locked)
        # The step must still fail if any test fails, and it must name what failed: a bare
        # exit status cannot be reviewed and cannot be acted on. `--no-fail-fast` runs every
        # test so one run reveals every failure, and each failing test is surfaced as an
        # annotation. No assertion is skipped, weakened or made advisory.
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'test.log'
          cargo test --workspace --all-targets --locked --no-fail-fast 2>&1 |
            Tee-Object -FilePath $log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Select-String -Path $log -Pattern '^test .* FAILED$' |
              ForEach-Object { Write-Output "::error title=failing-test::$($_.Line.Trim())" }
            $lines = Get-Content -Path $log
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^---- .* stdout ----') {
                $detail = ''
                for ($j = $i + 1; $j -lt $lines.Count -and $j -lt ($i + 12); $j++) {
                  if ($lines[$j].Trim().Length -gt 0) { $detail = $lines[$j].Trim(); break }
                }
                Write-Output "::error title=failing-test::$($lines[$i].Trim()) :: $detail"
              }
            }
          }
          exit $status


      # Mandatory `R03.C3` evidence. The confined image-inspection cases run again with their
      # output visible, so the real child pid, the confirmed geometry and the host-limit facts are
      # in the job log rather than only in a captured harness buffer. A failing case fails the job;
      # nothing here is advisory and nothing is allowed to skip on a host.
      - name: Confined image inspection evidence (both hosts)
        run: cargo test -p solo-cli --test media_worker_host_smoke --locked n097 -- --nocapture --test-threads=1


      # Mandatory `SOLO-WO-104 R01` Windows canaries. These three cases drive the real production
      # `CreateProcessW` / attribute-list / Job Object / minimal-environment path, so a Windows job is
      # the only place such facts exist. The gate fails when a required case is absent, filtered,
      # ignored or failing: the exact names and the exact passing count are both asserted, and a
      # green workflow with no N102 execution is a failure rather than a pass.
      - name: Windows N102 isolation canaries (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $required = @(
            'n102::n102_01_extra_inheritable_handle_is_excluded',
            'n102::n102_02_parent_environment_is_excluded',
            'n102::n102_03_native_failures_refuse_and_cleanup',
            'n102::n102_04_a_concurrent_worker_is_unaffected_by_a_fault',
          )
          $log = Join-Path $env:RUNNER_TEMP 'n102-canaries.txt'
          cargo test -p solo-cli --test media_worker_host_smoke --locked n102_ -- --nocapture --test-threads=1 *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "the N102 canaries failed (exit $LASTEXITCODE)" }
          $text = Get-Content -LiteralPath $log -Raw
          foreach ($name in $required) {
            if ($text -notmatch [regex]::Escape("test $name ... ok")) {
              throw "required N102 case did not pass on this host: $name"
            }
          }
          if ($text -notmatch 'test result: ok\. 4 passed; 0 failed; 0 ignored') {
            throw 'the N102 run did not execute exactly four passing, non-ignored cases'
          }
          Write-Output 'N102 gate: four required canaries executed and passed.'


      # ---------------------------------------------------------------------------
      # Accepted fail-closed architecture checker, run as its own process so the
      # policy exit status — not a test harness — decides. No weaken switch exists.
      # ---------------------------------------------------------------------------
      - name: Architecture checker on the real checkout (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo test --locked -p solo-cli --test check-architecture > "$RUNNER_TEMP/arch-real.txt" 2>&1 \
            || { cat "$RUNNER_TEMP/arch-real.txt"; echo "::error::real-tree architecture check refused"; exit 1; }
          cat "$RUNNER_TEMP/arch-real.txt"
          grep -q 'architecture=legal packages=4' "$RUNNER_TEMP/arch-real.txt" \
            || { echo "::error::unexpected package set in real-tree report"; exit 1; }
          grep -q 'edges=68' "$RUNNER_TEMP/arch-real.txt" \
            || { echo "::error::approved edge count changed: $(grep -o 'edges=[0-9]*' "$RUNNER_TEMP/arch-real.txt" | head -n 1)"; exit 1; }

      - name: Architecture checker on the real checkout (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo test --locked -p solo-cli --test check-architecture > "$env:RUNNER_TEMP/arch-real.txt" 2>&1
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/arch-real.txt" | Write-Output
          if ($code -ne 0) { throw "real-tree architecture check refused (exit $code)" }
          $text = Get-Content "$env:RUNNER_TEMP/arch-real.txt" -Raw
          if ($text -notmatch 'architecture=legal packages=4') { throw "unexpected package set in real-tree report" }
          if ($text -notmatch 'edges=68') {
            $measured = [regex]::Match($text, 'edges=[0-9]+').Value
            throw "approved edge count changed: $measured"
          }

      - name: Architecture refusal self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo test --locked -p solo-cli --test check-architecture -- --self-test > "$RUNNER_TEMP/arch-self.txt" 2>&1 \
            || { cat "$RUNNER_TEMP/arch-self.txt"; echo "::error::self-test matrix failed"; exit 1; }
          cat "$RUNNER_TEMP/arch-self.txt"
          grep -q 'self-check=passed cases=29' "$RUNNER_TEMP/arch-self.txt" \
            || { echo "::error::unexpected self-test case count or outcome"; exit 1; }
          test "$(grep -c '^ok ' "$RUNNER_TEMP/arch-self.txt")" -eq 29 \
            || { echo "::error::not every self-test case reported ok"; exit 1; }
          test "$(grep -c '^FAIL' "$RUNNER_TEMP/arch-self.txt")" -eq 0 \
            || { echo "::error::a self-test case reported FAIL"; exit 1; }
          test "$(grep -c 'refused as ' "$RUNNER_TEMP/arch-self.txt")" -eq 23 \
            || { echo "::error::not every forbidden fixture was refused"; exit 1; }
          test "$(grep -c 'legal form accepted' "$RUNNER_TEMP/arch-self.txt")" -eq 5 \
            || { echo "::error::not every legal twin was accepted"; exit 1; }
          grep -qE '^ok +checker-bypass +refused as layer-outward-reference' "$RUNNER_TEMP/arch-self.txt" \
            || { echo "::error::checker-bypass was not refused as layer-outward-reference"; exit 1; }
          grep -qE '^ok +dynamic-load +refused as dynamic-loading' "$RUNNER_TEMP/arch-self.txt" \
            || { echo "::error::dynamic-load was not refused as dynamic-loading"; exit 1; }

      - name: Architecture refusal self-test (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo test --locked -p solo-cli --test check-architecture -- --self-test > "$env:RUNNER_TEMP/arch-self.txt" 2>&1
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/arch-self.txt" | Write-Output
          if ($code -ne 0) { throw "self-test matrix failed (exit $code)" }
          $text = Get-Content "$env:RUNNER_TEMP/arch-self.txt" -Raw
          if ($text -notmatch 'self-check=passed cases=29') { throw "unexpected self-test case count or outcome" }
          $failed = ([regex]::Matches($text, '(?m)^FAIL')).Count
          $refused = ([regex]::Matches($text, 'refused as ')).Count
          $legal = ([regex]::Matches($text, 'legal form accepted')).Count
          if ($failed -ne 0) { throw "$failed self-test case(s) reported FAIL" }
          if ($refused -ne 23) { throw "only $refused forbidden fixtures reported refused" }
          if ($legal -ne 5) { throw "only $legal legal twins reported accepted" }
          if ($text -notmatch '(?m)^ok +checker-bypass +refused as layer-outward-reference') {
            throw "checker-bypass was not refused as layer-outward-reference"
          }
          if ($text -notmatch '(?m)^ok +dynamic-load +refused as dynamic-loading') {
            throw "dynamic-load was not refused as dynamic-loading"
          }


      # ---------------------------------------------------------------------------
      # Failure-sensitivity tripwire. The unmodified target must pass; the injected
      # run must fail with the specific diagnostic and exactly one failed test. A
      # missing invocation, unrelated panic or swallowed exit fails the probe.
      # ---------------------------------------------------------------------------
      - name: Test-failure tripwire (Linux)
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail
          cargo test --locked -p solo-cli --test ci_gate_tripwire > "$RUNNER_TEMP/tripwire-normal.txt" 2>&1
          normal=$?
          if [ "$normal" -ne 0 ]; then
            cat "$RUNNER_TEMP/tripwire-normal.txt"
            echo "::error::tripwire must pass in the unmodified environment"
            exit 1
          fi
          grep -q 'test result: ok. 1 passed; 0 failed' "$RUNNER_TEMP/tripwire-normal.txt" \
            || { cat "$RUNNER_TEMP/tripwire-normal.txt"; echo "::error::tripwire did not run exactly one passing test"; exit 1; }
          set +e
          SOLO_CI_INJECT_TEST_FAILURE=1 cargo test --locked -p solo-cli --test ci_gate_tripwire > "$RUNNER_TEMP/tripwire-injected.txt" 2>&1
          injected=$?
          set -e
          cat "$RUNNER_TEMP/tripwire-injected.txt"
          if [ "$injected" -eq 0 ]; then
            echo "::error::an injected test fault still produced exit 0"
            exit 1
          fi
          grep -q 'SOLO_CI_TRIPWIRE_INJECTED_FAILURE' "$RUNNER_TEMP/tripwire-injected.txt" \
            || { echo "::error::injected run failed without the expected diagnostic"; exit 1; }
          grep -q '1 failed' "$RUNNER_TEMP/tripwire-injected.txt" \
            || { echo "::error::injected run did not report exactly one failed test"; exit 1; }
          echo "tripwire=verified normal=pass injected_exit=$injected"

      - name: Test-failure tripwire (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo test --locked -p solo-cli --test ci_gate_tripwire > "$env:RUNNER_TEMP/tripwire-normal.txt" 2>&1
          $normal = $LASTEXITCODE
          if ($normal -ne 0) {
            Get-Content "$env:RUNNER_TEMP/tripwire-normal.txt" | Write-Output
            throw "tripwire must pass in the unmodified environment (exit $normal)"
          }
          $ok = Get-Content "$env:RUNNER_TEMP/tripwire-normal.txt" -Raw
          if ($ok -notmatch 'test result: ok\. 1 passed; 0 failed') { throw "tripwire did not run exactly one passing test" }
          $env:SOLO_CI_INJECT_TEST_FAILURE = '1'
          cargo test --locked -p solo-cli --test ci_gate_tripwire > "$env:RUNNER_TEMP/tripwire-injected.txt" 2>&1
          $injected = $LASTEXITCODE
          Remove-Item Env:SOLO_CI_INJECT_TEST_FAILURE
          Get-Content "$env:RUNNER_TEMP/tripwire-injected.txt" | Write-Output
          if ($injected -eq 0) { throw "an injected test fault still produced exit 0" }
          $bad = Get-Content "$env:RUNNER_TEMP/tripwire-injected.txt" -Raw
          if ($bad -notmatch 'SOLO_CI_TRIPWIRE_INJECTED_FAILURE') { throw "injected run failed without the expected diagnostic" }
          if ($bad -notmatch '1 failed') { throw "injected run did not report exactly one failed test" }
          Write-Output "tripwire=verified normal=pass injected_exit=$injected"
          # The injected run intentionally left LASTEXITCODE nonzero; the probe has
          # verified that expected failure, so clear it and end the step cleanly.
          $global:LASTEXITCODE = 0
          exit 0


      # ---------------------------------------------------------------------------
      # Release artifact. The smoke tests below run THIS binary (never a debug build,
      # never a downloaded artifact), and it is built after the tree was verified.
      # ---------------------------------------------------------------------------
      - name: Release build (workspace, locked)
        run: cargo build --workspace --release --locked

      - name: Release CLI smoke on the built binary (Linux)
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail
          exe="${{ matrix.cli_path }}"
          test -x "$exe" || { echo "::error::release binary missing"; exit 1; }
          sha256sum "$exe"
          set +e
          "$exe" bootstrap-preflight --entity-id entity-7 --base-url https://EXAMPLE.com:443/alpha > "$RUNNER_TEMP/ok.out" 2> "$RUNNER_TEMP/ok.err"
          ok_status=$?
          "$exe" bootstrap-preflight --entity-id Main --base-url https://example.com > "$RUNNER_TEMP/bad.out" 2> "$RUNNER_TEMP/bad.err"
          bad_status=$?
          set -e
          printf 'preflight=ok entity_id=entity-7 base=https://example.com/alpha\n' > "$RUNNER_TEMP/ok.want"
          printf 'error: PREFLIGHT_ENTITY_ID_INVALID: invalid-start\n' > "$RUNNER_TEMP/bad.want"
          [ "$ok_status" -eq 0 ] || { echo "::error::accepted invocation exited $ok_status"; exit 1; }
          [ "$bad_status" -eq 2 ] || { echo "::error::refused invocation exited $bad_status"; exit 1; }
          cmp -s "$RUNNER_TEMP/ok.out" "$RUNNER_TEMP/ok.want" \
            || { echo "::error::accepted stdout is not byte-identical"; od -c "$RUNNER_TEMP/ok.out"; exit 1; }
          test ! -s "$RUNNER_TEMP/ok.err" || { echo "::error::accepted invocation wrote stderr"; exit 1; }
          test ! -s "$RUNNER_TEMP/bad.out" || { echo "::error::refused invocation wrote stdout"; exit 1; }
          cmp -s "$RUNNER_TEMP/bad.err" "$RUNNER_TEMP/bad.want" \
            || { echo "::error::refused stderr is not byte-identical"; od -c "$RUNNER_TEMP/bad.err"; exit 1; }
          echo "release_smoke=verified accepted_exit=$ok_status refused_exit=$bad_status"

      - name: Release CLI smoke on the built binary (Windows)
        if: runner.os == 'Windows'
        run: |
          $exe = "${{ matrix.cli_path }}"
          if (-not (Test-Path $exe)) { throw "release binary missing" }
          Write-Output "release_exe_sha256=$((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower())"
          $enc = New-Object System.Text.UTF8Encoding($false)
          function Invoke-Cli {
            param([string[]]$CliArgs, [string]$Tag)
            $outPath = Join-Path $env:RUNNER_TEMP "$Tag.out"
            $errPath = Join-Path $env:RUNNER_TEMP "$Tag.err"
            $proc = Start-Process -FilePath $exe -ArgumentList $CliArgs -RedirectStandardOutput $outPath -RedirectStandardError $errPath -NoNewWindow -Wait -PassThru
            return [pscustomobject]@{
              Exit = $proc.ExitCode
              Out  = [System.IO.File]::ReadAllBytes($outPath)
              Err  = [System.IO.File]::ReadAllBytes($errPath)
            }
          }
          $accept = Invoke-Cli -CliArgs @('bootstrap-preflight', '--entity-id', 'entity-7', '--base-url', 'https://EXAMPLE.com:443/alpha') -Tag 'ok'
          $refuse = Invoke-Cli -CliArgs @('bootstrap-preflight', '--entity-id', 'Main', '--base-url', 'https://example.com') -Tag 'bad'
          $wantOk = $enc.GetBytes("preflight=ok entity_id=entity-7 base=https://example.com/alpha`n")
          $wantBad = $enc.GetBytes("error: PREFLIGHT_ENTITY_ID_INVALID: invalid-start`n")
          if ($accept.Exit -ne 0) { throw "accepted invocation exited $($accept.Exit)" }
          if ($refuse.Exit -ne 2) { throw "refused invocation exited $($refuse.Exit)" }
          if (-not [System.Linq.Enumerable]::SequenceEqual([byte[]]$accept.Out, [byte[]]$wantOk)) {
            throw "accepted stdout is not byte-identical: $([System.BitConverter]::ToString($accept.Out))"
          }
          if ($accept.Err.Length -ne 0) { throw "accepted invocation wrote stderr" }
          if ($refuse.Out.Length -ne 0) { throw "refused invocation wrote stdout" }
          if (-not [System.Linq.Enumerable]::SequenceEqual([byte[]]$refuse.Err, [byte[]]$wantBad)) {
            throw "refused stderr is not byte-identical: $([System.BitConverter]::ToString($refuse.Err))"
          }
          Write-Output "release_smoke=verified accepted_exit=0 refused_exit=2"
          $global:LASTEXITCODE = 0
          exit 0


      # ---------------------------------------------------------------------------
      # Adversarial source evidence (Ubuntu). A real, forbidden domain→adapter import
      # is injected into THIS disposable runner checkout only, scanned by the already
      # built checker binary, and the original bytes are restored on every outcome.
      # ===========================================================================
      - name: Forbidden import and bypass refusal with guaranteed restore (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # GitHub invokes bash with -e; these probes deliberately run commands that
          # MUST exit nonzero, so -e is disabled here and every status is checked by
          # hand. No gate is skipped: each nonzero outcome is asserted explicitly.
          set +e
          set -uo pipefail
          target_file=crates/solo-domain/src/lib.rs
          backup="$RUNNER_TEMP/solo-domain-lib.rs"
          restore() { if [ -f "$backup" ]; then cp "$backup" "$target_file"; fi; }
          trap restore EXIT INT TERM

          cargo test --locked -p solo-cli --test check-architecture --no-run --message-format=json > "$RUNNER_TEMP/checker-build.json" 2>&1
          build_status=$?
          if [ "$build_status" -ne 0 ]; then cat "$RUNNER_TEMP/checker-build.json"; echo "::error::checker build failed"; exit 1; fi
          checker=$(grep -o '"executable":"[^"]*check_architecture[^"]*"' "$RUNNER_TEMP/checker-build.json" | tail -n 1 | sed 's/^"executable":"//; s/"$//')
          if [ -z "$checker" ] || [ ! -x "$checker" ]; then echo "::error::checker executable not located"; exit 1; fi
          echo "checker_binary=$checker"

          "$checker"; legal=$?
          if [ "$legal" -ne 0 ]; then echo "::error::legal tree refused before injection"; exit 1; fi
          echo "pre_injection_real_tree=legal"

          for pair in \
            checker-bypass:layer-outward-reference \
            direct-outward:layer-outward-reference \
            renamed-alias:layer-outward-reference \
            reexport-chain:layer-outward-reference \
            dynamic-load:dynamic-loading; do
            id=${pair%%:*}
            want=${pair##*:}
            "$checker" --fixture "$id" > "$RUNNER_TEMP/fixture-$id.txt" 2>&1
            status=$?
            cat "$RUNNER_TEMP/fixture-$id.txt"
            [ "$status" -eq 1 ] || { echo "::error::fixture $id exited $status, expected 1 (refused)"; exit 1; }
            grep -q 'outcome=refused' "$RUNNER_TEMP/fixture-$id.txt" || { echo "::error::fixture $id was not refused"; exit 1; }
            grep -q 'category_match=true' "$RUNNER_TEMP/fixture-$id.txt" || { echo "::error::fixture $id refused for the wrong category"; exit 1; }
            grep -q "expected=$want" "$RUNNER_TEMP/fixture-$id.txt" || { echo "::error::fixture $id did not report expected=$want"; exit 1; }
          done

          "$checker" --fixture not-a-real-fixture > /dev/null 2>&1; usage_one=$?
          "$checker" --disable > /dev/null 2>&1; usage_two=$?
          { [ "$usage_one" -eq 2 ] && [ "$usage_two" -eq 2 ]; } \
            || { echo "::error::usage errors did not exit 2 (got $usage_one and $usage_two)"; exit 1; }

          cp "$target_file" "$backup"
          original_sha=$(sha256sum "$target_file" | cut -d' ' -f1)
          printf '\nuse solo_adapters::CliOutcome;\n\n#[allow(dead_code)]\npub fn ci_forbidden_probe(_value: Option<CliOutcome>) {}\n' >> "$target_file"
          "$checker" > "$RUNNER_TEMP/injected-source.txt" 2>&1
          injected=$?
          cat "$RUNNER_TEMP/injected-source.txt"
          if [ "$injected" -ne 1 ]; then echo "::error::injected forbidden import exited $injected, expected 1"; exit 1; fi
          # A reference from solo-domain to the adapter crate is refused by the source
          # scanner's root classification. Because solo-domain's manifest declares no
          # adapter dependency, the reference cannot be resolved to a declared workspace
          # root, so the bounded category for THIS injected form is `undeclared-crate`
          # (the same rule that catches the accepted `undeclared-crate` fixture). The
          # declared-but-outward form is separately required below to be refused as
          # `layer-outward-reference` by the direct-outward/renamed-alias/reexport-chain
          # fixtures, and dynamic loading as `dynamic-loading`.
          injected_category=$(sed -n 's/^error: \([a-z-]*\): .*/\1/p' "$RUNNER_TEMP/injected-source.txt" | head -n 1)
          echo "injected_refusal_category=$injected_category"
          echo "::notice::injected forbidden import refused with category '$injected_category' and exit $injected"
          if [ "$injected_category" != 'undeclared-crate' ]; then
            echo "::error::injected source refused as '$injected_category', expected the bounded undeclared-crate category"
            exit 1
          fi
          grep -q 'solo-domain' "$RUNNER_TEMP/injected-source.txt" \
            || { echo "::error::refusal did not name the injected solo-domain unit"; exit 1; }

          restore
          restored_sha=$(sha256sum "$target_file" | cut -d' ' -f1)
          [ "$restored_sha" = "$original_sha" ] || { echo "::error::source not restored byte-for-byte"; exit 1; }
          git diff --exit-code -- "$target_file" || { echo "::error::tracked source differs after restore"; exit 1; }
          test -z "$(git status --porcelain -- "$target_file")" || { echo "::error::residue after restore"; exit 1; }
          "$checker"; after=$?
          [ "$after" -eq 0 ] || { echo "::error::real tree no longer legal after restore"; exit 1; }
          echo "forbidden_import_probe=verified injected_exit=$injected restored_sha256=$restored_sha"

      # ---------------------------------------------------------------------------
      # Reproducibility: two genuinely independent clean release builds on one host,
      # each in its own initially empty target directory, compared on raw bytes.
      # ===========================================================================
      - name: Two clean release builds compared byte-for-byte (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail
          echo "lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"
          for variant in a b; do
            dir="$RUNNER_TEMP/target-$variant"
            rm -rf "$dir"
            if ! CARGO_TARGET_DIR="$dir" cargo build --workspace --release --locked; then
              echo "::error::clean release build $variant failed"
              exit 1
            fi
            test -f "$dir/release/solo-cli" || { echo "::error::missing binary in target-$variant"; exit 1; }
          done
          first=$(sha256sum "$RUNNER_TEMP/target-a/release/solo-cli" | cut -d' ' -f1)
          second=$(sha256sum "$RUNNER_TEMP/target-b/release/solo-cli" | cut -d' ' -f1)
          echo "clean_release_sha256_a=$first"
          echo "clean_release_sha256_b=$second"
          echo "clean_release_bytes=$(stat -c%s "$RUNNER_TEMP/target-a/release/solo-cli")"
          [ "$first" = "$second" ] || { echo "::error::two clean release builds are not byte-identical"; exit 1; }
          echo "reproducibility=verified"


