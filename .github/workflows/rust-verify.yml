            echo "| rustsec_db_fetched_at_utc | \`${DENY_DB_FETCHED_AT:-NOT RUN}\` |"
            echo "| lock_sha256_after_security_gate | \`${DENY_LOCK_SHA256:-NOT RUN}\` |"
            echo "| advisory_negative_probe | \`${DENY_PROBE_ADVISORY:-NOT RUN}\` on \`${DENY_PROBE_CRATE:-n/a}\` refused with exit \`${DENY_PROBE_EXIT:-n/a}\` |"
            echo "| fail_injection_marker | architecture tripwire refused its injected failure; advisory probe refused its known-vulnerable fixture |"
