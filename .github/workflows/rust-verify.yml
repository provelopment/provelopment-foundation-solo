          if ($LASTEXITCODE -ne 0) { throw 'n128 domain matrix failed' }
          cargo test -p solo-application --test platform_graphic_baseline --locked n128_07 -- --nocapture 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw 'n128 binding case failed' }
          $tokens = @(
            'test result: ok. 6 passed; 0 failed; 0 ignored',
            'test result: ok. 1 passed; 0 failed; 0 ignored',
            'n128_evidence case=01 root=visible_at_entity=true descends=5',
            'n128_evidence case=02 nearer=win still_nearer=win lineage=3',
            'n128_evidence case=03 root_suppress=cleared descendant_suppress=final',
            'n128_evidence case=04 slot_replaced=1 others_preserved=2 order=stable max=4',
            'n128_evidence case=05 unregistered=absent wrong_role=refused',
            'n128_evidence case=06 internal_hidden=true no_public_reappearance=true',
            'n128_evidence case=07 binding=exact read=2 digest_matched=true',
            'publication_authority=false')
          function Test-N128([string] $path) {
            $text = Get-Content -Raw -LiteralPath $path
            foreach ($token in $tokens) { if (-not $text.Contains($token)) { return $false } }
            if (([regex]::Matches($text, 'n128_evidence case=')).Count -lt 7) { return $false }
            if ($text.Contains('... FAILED')) { return $false }
            if ($text.Contains('test result: FAILED')) { return $false }
            return $true
          }
          if (-not (Test-N128 $log)) { throw 'authentic N128 run rejected' }
          Write-Output 'n128_gate authentic=accepted'
          $probe = Join-Path $env:RUNNER_TEMP 'n128-probe.txt'
          $authentic = Get-Content -Raw -LiteralPath $log
          Set-Content -LiteralPath $probe -NoNewline -Value $authentic.Replace('lineage=3', 'lineage=1')
          if (Test-N128 $probe) { throw 'forged precedence lineage accepted' }
          $forgedPrivacy = $authentic.Replace('internal_hidden=true', 'internal_hidden=false').Replace('publication_authority=false', 'publication_authority=true')
          Set-Content -LiteralPath $probe -NoNewline -Value $forgedPrivacy
          if (Test-N128 $probe) { throw 'forged privacy or publication claim accepted' }
          $missingCase = [regex]::Replace($authentic, '(?m)^.*n128_evidence case=04.*$\r?\n', '')
          Set-Content -LiteralPath $probe -NoNewline -Value $missingCase
          if (Test-N128 $probe) { throw 'missing case accepted' }
          Set-Content -LiteralPath $probe -NoNewline -Value $authentic.Replace('test result: ok. 6 passed', 'test result: ok. 5 passed')
