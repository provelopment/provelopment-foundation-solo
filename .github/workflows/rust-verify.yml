      # ---------------------------------------------------------------------------
      # R03 D2 fixture cleanup — guaranteed, fail-closed, Ubuntu only.
      #
      # Runs even when an earlier step failed. It unmounts only the exact task-owned mount
      # points created above, detaches only the loop device that still references this job's
      # own image, and deletes the owned image and mount points only after every unmount has
      # succeeded. A failed unmount is reported and left visible rather than deleted behind.
      # ---------------------------------------------------------------------------
      - name: R03 snapshot-test filesystem cleanup (Ubuntu only, guaranteed)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          tag="solo-r03-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          img="$RUNNER_TEMP/$tag.img"
          mnt="$RUNNER_TEMP/$tag-btrfs"
          tmp="$RUNNER_TEMP/$tag-tmpfs"
          failed=0

          for d in "$mnt" "$tmp"; do
            [ -d "$d" ] || continue
            if mountpoint -q "$d"; then
              if sudo umount "$d"; then
                echo "unmounted=$d"
              else
                echo "::error::unmount failed for $d; leaving it in place rather than deleting behind a live mount"
                failed=1
              fi
            fi
          done

          if [ "$failed" -ne 0 ]; then
            findmnt -no FSTYPE,SOURCE,TARGET "$mnt" "$tmp" || true
            exit 1
          fi

          loop_devices="$(losetup -j "$img" 2>/dev/null | cut -d: -f1)"
          for dev in $loop_devices; do
            if sudo losetup -d "$dev"; then
              echo "detached_loop=$dev"
            else
              echo "::error::could not detach $dev owned by this job"
              exit 1
            fi
          done

          if [ -e "$img" ]; then
            rm -f -- "$img"
            echo "removed_image=$img"
          fi
          for d in "$mnt" "$tmp"; do
            if [ -e "$d" ]; then
              rm -rf -- "$d"
              echo "removed_mountpoint=$d"
            fi
          done

          for p in "$img" "$mnt" "$tmp"; do
            if [ -e "$p" ]; then
              echo "::error::cleanup left $p behind"
              exit 1
            fi
          done
          echo "r03_fixture_cleanup=complete"

