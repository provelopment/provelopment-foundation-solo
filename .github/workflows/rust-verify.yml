            if ($text -notmatch '(?m)^test n102::n102_01_extra_inheritable_handle_is_excluded \.\.\.') { throw "N102_01 did not execute on repetition $run" }
            if ($text -notmatch 'extra_event_signaled=false control_event_signaled=false local_witness=true') { throw "N102_01 printed no object-identity evidence on repetition $run" }
            if ($text -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored') { throw "N102_01 did not pass alone on repetition $run" }
            Write-Output "N102 repeat $run/12 passed"
          }
          Write-Output 'N102 event-identity repeatability: 12/12 consecutive native Windows runs passed.'


      # ---------------------------------------------------------------------------
