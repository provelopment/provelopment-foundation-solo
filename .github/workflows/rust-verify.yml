            echo "| checkout_action | \`actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1\` (v7.0.1) |"
            echo "| security_scanner | \`${DENY_SCANNER_VERSION:-NOT RUN}\` from \`${DENY_SCANNER_ASSET:-n/a}\` |"
