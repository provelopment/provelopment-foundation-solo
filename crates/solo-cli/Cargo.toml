[package]
name = "solo-cli"
description = "Foundation Solo single binary: the one composition root for the R01.A slice."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "solo-cli"
path = "src/main.rs"

[dependencies]
solo-adapters = { workspace = true }
solo-application = { workspace = true }

[dev-dependencies]
# Test-only: parses real `cargo metadata` in the architecture graph guard.
# Never used for authored input or as a production parser.
serde_json = "=1.0.154"
# Test/check-only AST parser for the R01.B source-boundary checker (Architecture
# §6A.2/§6A.3). A development edge of `solo-cli` alone: it is never a runtime
# dependency, never shipped, and never whitelisted for the inner crates.
syn = { version = "=3.0.9", features = ["full", "visit"] }

# Test-only architecture checker target. `harness = false` gives the checker its own
# process exit status so a violation is a real nonzero exit, not merely a failed test
# case. The ordinary `cargo test --workspace --all-targets --locked` still executes
# the legal-tree gate by default, because this target is run with no arguments.
[[test]]
name = "check-architecture"
path = "tests/check_architecture.rs"
harness = false

