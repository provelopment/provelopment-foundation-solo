[package]
name = "solo-adapters"
description = "Foundation Solo driving adapter: CLI argument translation and safe result rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
solo-application = { workspace = true }
solo-domain = { workspace = true }
serde = "=1.0.229"
serde_json = "=1.0.154"

# The single approved offline still-image codec (`SOLO-WO-097 R01`, Architecture §6A).
#
# Exactly one version, no default features: the format-specific decoders and every
# default-on capability (`default-formats`, `rayon`, GIF, TIFF, HDR, native AVIF and
# native PNG/JPEG/WebP back-ends) stay out of the locked graph, so the only codec code
# compiled into this crate is the pure-Rust PNG, JPEG and WebP support the accepted
# `R03.C` slice names. Decoding is always invoked from an already-confined child process
# over owned in-memory bytes; this crate never decodes in the trusted parent.
image = { version = "=0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }

# The two native source-read roots. Each is target-gated so exactly one is ever
# compiled, which is what keeps the locked graph free of a duplicate `windows-sys`.
#
# `rustix` supplies the safe Linux `openat2` primitive: `RESOLVE_BENEATH`,
# `RESOLVE_NO_SYMLINKS`, `RESOLVE_NO_MAGICLINKS` and `RESOLVE_NO_XDEV` are requested on
# every open, so confinement and no-follow are kernel-enforced rather than inferred from a
# string. `fs` carries the file-system calls, and `std` is required because the trusted root
# arrives as a `std::path::Path` and `rustix` implements its path-argument trait for `&Path`
# only with `std` enabled; without it the caller path would have to be copied into a
# `CString`, which would be a second, weaker spelling of the same trust input.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }

# `libc` supplies the two `getrlimit` observations behind the Linux limit-readback seam. It is
# already a node of the locked graph at this exact version, so this adds a direct dependency
# **edge** for the Linux target only: no new package, no new version and no Windows feature.
libc = { version = "=0.2.191", default-features = false }

# `windows-sys` supplies the raw NT entry point and the handle-metadata query. The
# features are the minimum that carries `NtCreateFile` with its `OBJECT_ATTRIBUTES` and
# `IO_STATUS_BLOCK` types, `GetFileInformationByHandleEx`, and the `FILE_ID_INFO` shape
# used for by-handle physical identity.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

